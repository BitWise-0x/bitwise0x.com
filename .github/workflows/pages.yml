name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'deploy:')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
      - id: configurepages
        uses: actions/configure-pages@v6
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-
      - run: yarn
      - run: yarn build
        env:
          EXPORT: 1
          UNOPTIMIZED: 1
          BASE_PATH: ${{ steps.configurepages.outputs.base_path }}
          NEXT_PUBLIC_GISCUS_REPO: ${{ vars.NEXT_PUBLIC_GISCUS_REPO }}
          NEXT_PUBLIC_GISCUS_REPOSITORY_ID: ${{ vars.NEXT_PUBLIC_GISCUS_REPOSITORY_ID }}
          NEXT_PUBLIC_GISCUS_CATEGORY: ${{ vars.NEXT_PUBLIC_GISCUS_CATEGORY }}
          NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}
          NEXT_UMAMI_ID: ${{ vars.NEXT_UMAMI_ID }}
          NEXT_UMAMI_SRC: ${{ vars.NEXT_UMAMI_SRC }}
          NEXT_UMAMI_HOST_URL: ${{ vars.NEXT_UMAMI_HOST_URL }}
      # read from the build output: Cloudflare answers runner fetches of the live sitemap with 403
      - id: indexnow
        env:
          INDEXNOW_KEY: 4dd89e475d9c242c34377aada8223998
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, datetime, xml.etree.ElementTree as ET
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          since = (datetime.date.today() - datetime.timedelta(days=3)).isoformat()
          urls = ['https://bitwise0x.com/', 'https://bitwise0x.com/blog']
          for u in ET.parse('out/sitemap.xml').getroot().findall('s:url', ns):
              loc, mod = u.findtext('s:loc', '', ns), u.findtext('s:lastmod', '', ns)
              if mod[:10] >= since and loc not in urls:
                  urls.append(loc)
          key = os.environ['INDEXNOW_KEY']
          print('payload=' + json.dumps({'host': 'bitwise0x.com', 'key': key,
                'keyLocation': f'https://bitwise0x.com/{key}.txt', 'urlList': urls}))
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # tells Bing and the other IndexNow engines about pages changed in the last three days;
      # the key is public by design (served at /<key>.txt), and a failed ping never fails the deploy
      - name: Notify IndexNow
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          printf '%s' "$PAYLOAD" | curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
