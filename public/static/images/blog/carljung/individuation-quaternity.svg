<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" style="stop-color:#1c2733;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ab3e8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7fd9c4;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow)" />

  <!-- outer quaternity circle -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.55" />
  <circle cx="400" cy="400" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.3" stroke-dasharray="2 6" />

  <!-- cross axes connecting the four stages -->
  <line x1="400" y1="120" x2="400" y2="680" stroke="url(#ringGrad)" stroke-width="1" opacity="0.35" />
  <line x1="120" y1="400" x2="680" y2="400" stroke="url(#ringGrad)" stroke-width="1" opacity="0.35" />

  <!-- center: Self -->
  <circle cx="400" cy="400" r="54" fill="#0d1117" stroke="url(#ringGrad)" stroke-width="2" />
  <circle cx="400" cy="400" r="38" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.6" />
  <text x="400" y="407" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#e7ede8" text-anchor="middle">Self</text>

  <!-- Persona: top -->
  <circle cx="400" cy="120" r="46" fill="#131a22" stroke="url(#ringGrad)" stroke-width="1.5" />
  <path d="M 383 112 q 17 -14 34 0 q 3 14 -17 18 q -20 -4 -17 -18 z" fill="none" stroke="#9fd7c7" stroke-width="1.5" opacity="0.85" />
  <text x="400" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#e7ede8" text-anchor="middle">Persona</text>
  <text x="400" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9fb0a8" text-anchor="middle" font-style="italic">the social mask</text>

  <!-- Shadow: right -->
  <circle cx="680" cy="400" r="46" fill="#131a22" stroke="url(#ringGrad)" stroke-width="1.5" />
  <circle cx="680" cy="400" r="16" fill="none" stroke="#9fd7c7" stroke-width="1.5" opacity="0.85" />
  <path d="M 668 400 a 12 12 0 0 0 12 12 a 9 9 0 0 1 -12 -12 z" fill="#9fd7c7" opacity="0.85" />
  <text x="680" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#e7ede8" text-anchor="middle">Shadow</text>
  <text x="680" y="488" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9fb0a8" text-anchor="middle" font-style="italic">the rejected self</text>

  <!-- Anima/Animus: bottom -->
  <circle cx="400" cy="680" r="46" fill="#131a22" stroke="url(#ringGrad)" stroke-width="1.5" />
  <path d="M 400 664 a 11 11 0 1 1 -0.01 0 z M 400 675 v 20 M 393 689 h 14" fill="none" stroke="#9fd7c7" stroke-width="1.5" opacity="0.85" />
  <text x="400" y="746" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#e7ede8" text-anchor="middle">Anima / Animus</text>
  <text x="400" y="768" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9fb0a8" text-anchor="middle" font-style="italic">the inner other</text>

  <!-- Persona↔Shadow, Shadow↔Anima, etc small connective ticks along the ring at diagonals -->
  <circle cx="597" cy="203" r="3" fill="#9fd7c7" opacity="0.5" />
  <circle cx="597" cy="597" r="3" fill="#9fd7c7" opacity="0.5" />
  <circle cx="203" cy="597" r="3" fill="#9fd7c7" opacity="0.5" />
  <circle cx="203" cy="203" r="3" fill="#9fd7c7" opacity="0.5" />
</svg>
