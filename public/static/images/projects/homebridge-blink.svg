<svg width="544" height="306" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ab3e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c9ad6;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots5" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#4ab3e8" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="544" height="306" fill="#1a1b26"/>
  <rect width="544" height="306" fill="url(#dots5)"/>

  <!-- Camera body -->
  <rect x="246" y="98" width="42" height="30" rx="4" fill="none" stroke="url(#grad5)" stroke-width="1.6" opacity="0.9"/>
  <!-- Lens outer ring -->
  <circle cx="267" cy="113" r="9" fill="none" stroke="url(#grad5)" stroke-width="1.4" opacity="0.7"/>
  <!-- Lens inner -->
  <circle cx="267" cy="113" r="4.5" fill="none" stroke="url(#grad5)" stroke-width="1.4" opacity="1"/>
  <!-- Camera mount/arm -->
  <line x1="288" y1="113" x2="304" y2="113" stroke="url(#grad5)" stroke-width="1.8" opacity="0.6"/>
  <!-- Motion detection arcs -->
  <path d="M 309 106 Q 317 113 309 120" fill="none" stroke="url(#grad5)" stroke-width="1.4" opacity="0.5"/>
  <path d="M 314 101 Q 325 113 314 125" fill="none" stroke="url(#grad5)" stroke-width="1.4" opacity="0.3"/>

  <!-- Project name -->
  <text x="272" y="166" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="url(#grad5)" text-anchor="middle">Homebridge</text>
  <text x="272" y="192" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="url(#grad5)" text-anchor="middle">Blink Security</text>

  <!-- Description -->
  <text x="272" y="216" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Blink Cameras · Live View · HomeKit</text>
</svg>
