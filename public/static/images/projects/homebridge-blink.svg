<svg width="544" height="306" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ab3e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c9ad6;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots5" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#4ab3e8" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="544" height="306" fill="#1a1b26"/>
  <rect width="544" height="306" fill="url(#dots5)"/>

  <!-- Camera body -->
  <rect x="242" y="58" width="46" height="32" rx="4" fill="none" stroke="url(#grad5)" stroke-width="1.8" opacity="0.9"/>
  <!-- Lens outer ring -->
  <circle cx="265" cy="74" r="10" fill="none" stroke="url(#grad5)" stroke-width="1.5" opacity="0.7"/>
  <!-- Lens inner -->
  <circle cx="265" cy="74" r="5" fill="none" stroke="url(#grad5)" stroke-width="1.5" opacity="1"/>
  <!-- Camera mount/arm -->
  <line x1="288" y1="74" x2="308" y2="74" stroke="url(#grad5)" stroke-width="2" opacity="0.6"/>
  <!-- Motion detection arcs -->
  <path d="M 314 66 Q 323 74 314 82" fill="none" stroke="url(#grad5)" stroke-width="1.5" opacity="0.5"/>
  <path d="M 319 61 Q 332 74 319 87" fill="none" stroke="url(#grad5)" stroke-width="1.5" opacity="0.3"/>

  <!-- Project name -->
  <text x="272" y="144" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="url(#grad5)" text-anchor="middle">Homebridge</text>
  <text x="272" y="176" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="url(#grad5)" text-anchor="middle">Blink Security</text>

  <!-- Description -->
  <text x="272" y="206" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Blink Cameras · Live View · HomeKit</text>
</svg>
