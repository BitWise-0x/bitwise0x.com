<svg width="544" height="306" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ab3e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c9ad6;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots3" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#4ab3e8" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="544" height="306" fill="#1a1b26"/>
  <rect width="544" height="306" fill="url(#dots3)"/>

  <!-- Neural network: input layer (left), hidden layer (center), output node (right) -->
  <!-- Connections: input → hidden -->
  <line x1="212" y1="66" x2="252" y2="62" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="212" y1="66" x2="252" y2="78" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="212" y1="66" x2="252" y2="94" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="212" y1="80" x2="252" y2="62" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="212" y1="80" x2="252" y2="78" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="212" y1="80" x2="252" y2="94" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="212" y1="94" x2="252" y2="62" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="212" y1="94" x2="252" y2="78" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="212" y1="94" x2="252" y2="94" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <!-- Connections: hidden → output -->
  <line x1="252" y1="62" x2="332" y2="80" stroke="url(#grad3)" stroke-width="1" opacity="0.35"/>
  <line x1="252" y1="78" x2="332" y2="80" stroke="url(#grad3)" stroke-width="1" opacity="0.35"/>
  <line x1="252" y1="94" x2="332" y2="80" stroke="url(#grad3)" stroke-width="1" opacity="0.35"/>

  <!-- Input layer nodes -->
  <circle cx="212" cy="66" r="4.5" fill="none" stroke="url(#grad3)" stroke-width="1.4" opacity="0.5"/>
  <circle cx="212" cy="80" r="4.5" fill="none" stroke="url(#grad3)" stroke-width="1.4" opacity="0.65"/>
  <circle cx="212" cy="94" r="4.5" fill="none" stroke="url(#grad3)" stroke-width="1.4" opacity="0.5"/>

  <!-- Hidden layer nodes -->
  <circle cx="252" cy="62" r="4.5" fill="none" stroke="url(#grad3)" stroke-width="1.4" opacity="0.7"/>
  <circle cx="252" cy="78" r="4.5" fill="none" stroke="url(#grad3)" stroke-width="1.4" opacity="0.85"/>
  <circle cx="252" cy="94" r="4.5" fill="none" stroke="url(#grad3)" stroke-width="1.4" opacity="0.7"/>

  <!-- Output node -->
  <circle cx="332" cy="80" r="6.5" fill="none" stroke="url(#grad3)" stroke-width="1.8" opacity="1"/>

  <!-- Project name -->
  <text x="272" y="166" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="url(#grad3)" text-anchor="middle">Open WebUI</text>
  <text x="272" y="192" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="url(#grad3)" text-anchor="middle">Ultimate Stack</text>

  <!-- Description -->
  <text x="272" y="216" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Docker · RAG · MCP · TTS · OCR · Search</text>
</svg>
