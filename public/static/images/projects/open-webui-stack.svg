<svg width="544" height="306" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ab3e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c9ad6;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots3" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#4ab3e8" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="544" height="306" fill="#1a1b26"/>
  <rect width="544" height="306" fill="url(#dots3)"/>

  <!-- Neural network: input layer (left), hidden layer (center), output node (right) -->
  <!-- Connections: input → hidden -->
  <line x1="200" y1="58" x2="252" y2="53" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="58" x2="252" y2="73" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="58" x2="252" y2="93" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="78" x2="252" y2="53" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="78" x2="252" y2="73" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="78" x2="252" y2="93" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="98" x2="252" y2="53" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="98" x2="252" y2="73" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="98" x2="252" y2="93" stroke="url(#grad3)" stroke-width="1" opacity="0.25"/>
  <!-- Connections: hidden → output -->
  <line x1="252" y1="53" x2="344" y2="78" stroke="url(#grad3)" stroke-width="1" opacity="0.35"/>
  <line x1="252" y1="73" x2="344" y2="78" stroke="url(#grad3)" stroke-width="1" opacity="0.35"/>
  <line x1="252" y1="93" x2="344" y2="78" stroke="url(#grad3)" stroke-width="1" opacity="0.35"/>

  <!-- Input layer nodes -->
  <circle cx="200" cy="58" r="5" fill="none" stroke="url(#grad3)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="78" r="5" fill="none" stroke="url(#grad3)" stroke-width="1.5" opacity="0.65"/>
  <circle cx="200" cy="98" r="5" fill="none" stroke="url(#grad3)" stroke-width="1.5" opacity="0.5"/>

  <!-- Hidden layer nodes -->
  <circle cx="252" cy="53" r="5" fill="none" stroke="url(#grad3)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="252" cy="73" r="5" fill="none" stroke="url(#grad3)" stroke-width="1.5" opacity="0.85"/>
  <circle cx="252" cy="93" r="5" fill="none" stroke="url(#grad3)" stroke-width="1.5" opacity="0.7"/>

  <!-- Output node -->
  <circle cx="344" cy="78" r="7" fill="none" stroke="url(#grad3)" stroke-width="2" opacity="1"/>

  <!-- Project name -->
  <text x="272" y="144" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="url(#grad3)" text-anchor="middle">Open WebUI</text>
  <text x="272" y="174" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="url(#grad3)" text-anchor="middle">Ultimate Stack</text>

  <!-- Description -->
  <text x="272" y="204" font-family="'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Docker · RAG · MCP · TTS · OCR · Search</text>
</svg>
